# ============================================================
# Daly BMS – Konfigurationsdatei
# ============================================================
# Diese Datei wird von Config.java automatisch eingelesen.
# Kommandozeilen-Argumente überschreiben die Werte hier.

# --- Serielle Schnittstelle ---
serial.device=/dev/ttyUSB0
serial.baudrate=9600
serial.databits=8
serial.parity=NONE
serial.stopbits=1
serial.read_timeout_ms=2000
serial.write_timeout_ms=2000
serial.request_retries=5
serial.address=4

# --- HTTP / REST Server ---
http.port=8080
http.poll_interval_seconds=30

# --- MQTT ---
mqtt.enabled=false
mqtt.broker=192.168.20.100
mqtt.port=1883
mqtt.username=dalybms
mqtt.password=eveakku
mqtt.topic=daly_bms

# --- Sicherheit ---
readonly=true                      # Schreibzugriff sperren (MOSFET, SOC). --read-write zum Entsperren.

# --- Logging ---
verbose=false
