openapi: 3.0.3

info:
  title: Daly BMS REST API
  description: |
    REST API zum Auslesen eines Daly BMS über RS485/USB.
    
    Die Daten werden im Hintergrund regelmäßig vom BMS abgefragt und gecacht.
    Das Abfrage-Intervall kann beim Start konfiguriert werden.
    
    ## Features
    - ⚡ SOC (Spannung, Strom, Ladezustand)
    - 🔋 Einzelne Zellspannungen
    - 🌡️ Temperatursensoren
    - 🔌 MOSFET Lade-/Entladestatus
    - ⚠️ Fehlermeldungen
    - 📊 Zyklen und Statusdaten
  version: 1.0.0
  contact:
    name: Daly BMS Java Service

servers:
  - url: http://localhost:8080
    description: Lokaler BMS Server

tags:
  - name: BMS Daten
    description: Batterie-Management-System Abfragen
  - name: Steuerung
    description: BMS Einstellungen ändern
  - name: System
    description: Server Status und Health Checks

paths:

  # ===================================================================
  # BMS Daten
  # ===================================================================

  /api/all:
    get:
      tags: [BMS Daten]
      summary: Alle BMS Daten
      description: |
        Gibt alle verfügbaren BMS-Daten als JSON zurück.
        Enthält SOC, Zellspannungen, Temperaturen, MOSFET-Status, 
        Fehler und allgemeinen BMS-Status.
      operationId: getAll
      responses:
        '200':
          description: Erfolgreiche Abfrage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllData'
              example:
                soc:
                  total_voltage: 52.5
                  current: 0.0
                  soc_percent: 18.9
                cell_voltage_range:
                  highest_voltage: 3.78
                  highest_cell: 14
                  lowest_voltage: 3.728
                  lowest_cell: 1
                temperature_range:
                  highest_temperature: 15
                  highest_sensor: 1
                  lowest_temperature: 15
                  lowest_sensor: 1
                mosfet_status:
                  mode: stationary
                  charging_mosfet: true
                  discharging_mosfet: true
                  capacity_ah: 5.67
                status:
                  cells: 14
                  temperature_sensors: 1
                  charger_running: false
                  load_running: false
                  cycles: 21
                cell_voltages:
                  '1': 3.728
                  '2': 3.734
                  '14': 3.78
                temperatures:
                  '1': 15
                errors:
                  - "SOC is too low. level one alarm"
                last_update: "2024-12-15 14:30:00"
        '503':
          description: BMS-Daten noch nicht verfügbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/soc:
    get:
      tags: [BMS Daten]
      summary: State of Charge (SOC)
      description: |
        Gesamtspannung, Strom und Ladezustand in Prozent.
        
        - **Strom negativ** = Akku wird geladen
        - **Strom positiv** = Akku wird entladen
        - **Strom 0** = Ruhezustand
      operationId: getSoc
      responses:
        '200':
          description: Erfolgreiche Abfrage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SOC'
              example:
                total_voltage: 52.5
                current: -2.5
                soc_percent: 85.3
                last_update: "2024-12-15 14:30:00"
        '404':
          description: SOC-Daten nicht verfügbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: BMS-Daten noch nicht verfügbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/cell-voltages:
    get:
      tags: [BMS Daten]
      summary: Einzelne Zellspannungen
      description: |
        Spannung jeder einzelnen Zelle in Volt.
        Die Anzahl der Zellen hängt vom BMS ab (z.B. 14s, 16s).
      operationId: getCellVoltages
      responses:
        '200':
          description: Erfolgreiche Abfrage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellVoltages'
              example:
                '1': 3.728
                '2': 3.734
                '3': 3.734
                '4': 3.736
                '5': 3.736
                '6': 3.742
                '7': 3.757
                '8': 3.766
                '9': 3.768
                '10': 3.761
                '11': 3.744
                '12': 3.78
                '13': 3.749
                '14': 3.78
                last_update: "2024-12-15 14:30:00"
        '404':
          description: Daten nicht verfügbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: BMS-Daten noch nicht verfügbar

  /api/cell-voltage-range:
    get:
      tags: [BMS Daten]
      summary: Zellspannungs-Bereich
      description: Zellen mit der höchsten und niedrigsten Spannung
      operationId: getCellVoltageRange
      responses:
        '200':
          description: Erfolgreiche Abfrage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellVoltageRange'
              example:
                highest_voltage: 3.78
                highest_cell: 14
                lowest_voltage: 3.728
                lowest_cell: 1
                last_update: "2024-12-15 14:30:00"
        '404':
          description: Daten nicht verfügbar
        '503':
          description: BMS-Daten noch nicht verfügbar

  /api/temperatures:
    get:
      tags: [BMS Daten]
      summary: Temperatursensoren
      description: Temperaturwerte aller Sensoren in °C
      operationId: getTemperatures
      responses:
        '200':
          description: Erfolgreiche Abfrage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Temperatures'
              example:
                '1': 15
                last_update: "2024-12-15 14:30:00"
        '404':
          description: Daten nicht verfügbar
        '503':
          description: BMS-Daten noch nicht verfügbar

  /api/temperature-range:
    get:
      tags: [BMS Daten]
      summary: Temperatur-Bereich
      description: Höchste und niedrigste Temperatur mit Sensor-Nummer
      operationId: getTemperatureRange
      responses:
        '200':
          description: Erfolgreiche Abfrage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemperatureRange'
              example:
                highest_temperature: 15
                highest_sensor: 1
                lowest_temperature: 15
                lowest_sensor: 1
                last_update: "2024-12-15 14:30:00"
        '404':
          description: Daten nicht verfügbar
        '503':
          description: BMS-Daten noch nicht verfügbar

  /api/mosfet:
    get:
      tags: [BMS Daten]
      summary: MOSFET Status
      description: |
        Lade- und Entlade-MOSFET Status, aktueller Modus und Restkapazität.
        
        Modi:
        - **stationary** - Ruhezustand
        - **charging** - Wird geladen
        - **discharging** - Wird entladen
      operationId: getMosfetStatus
      responses:
        '200':
          description: Erfolgreiche Abfrage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MosfetStatus'
              example:
                mode: stationary
                charging_mosfet: true
                discharging_mosfet: true
                capacity_ah: 5.67
                last_update: "2024-12-15 14:30:00"
        '404':
          description: Daten nicht verfügbar
        '503':
          description: BMS-Daten noch nicht verfügbar

  /api/status:
    get:
      tags: [BMS Daten]
      summary: BMS Status
      description: |
        Allgemeiner BMS-Status: Zellenanzahl, Temperatursensoren, 
        Lade-/Entladezyklen, Charger- und Load-Status.
      operationId: getStatus
      responses:
        '200':
          description: Erfolgreiche Abfrage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
              example:
                cells: 14
                temperature_sensors: 1
                charger_running: false
                load_running: false
                states:
                  DI1: false
                  DI2: true
                cycles: 21
                last_update: "2024-12-15 14:30:00"
        '404':
          description: Daten nicht verfügbar
        '503':
          description: BMS-Daten noch nicht verfügbar

  /api/errors:
    get:
      tags: [BMS Daten]
      summary: BMS Fehler
      description: |
        Liste aktiver Fehlermeldungen vom BMS.
        Ein leeres Array bedeutet keine Fehler.
      operationId: getErrors
      responses:
        '200':
          description: Erfolgreiche Abfrage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                  - "SOC is too low. level one alarm"
                has_errors: true
                last_update: "2024-12-15 14:30:00"
        '503':
          description: BMS-Daten noch nicht verfügbar

  # ===================================================================
  # Steuerung
  # ===================================================================

  /api/set/discharge-mosfet:
    put:
      tags: [Steuerung]
      summary: Entlade-MOSFET schalten
      description: |
        Schaltet den Entlade-MOSFET ein oder aus.
        **⚠️ Vorsicht:** Dies kann den Akku von der Last trennen!
      operationId: setDischargeMosfet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              properties:
                on:
                  type: boolean
                  description: true = einschalten, false = ausschalten
            example:
              on: true
      responses:
        '200':
          description: Erfolgreich gesetzt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Ungültige Anfrage
        '500':
          description: BMS-Kommunikationsfehler

  /api/set/charge-mosfet:
    put:
      tags: [Steuerung]
      summary: Lade-MOSFET schalten
      description: |
        Schaltet den Lade-MOSFET ein oder aus.
        **⚠️ Vorsicht:** Dies kann den Ladevorgang unterbrechen!
      operationId: setChargeMosfet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              properties:
                on:
                  type: boolean
            example:
              on: true
      responses:
        '200':
          description: Erfolgreich gesetzt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Ungültige Anfrage
        '500':
          description: BMS-Kommunikationsfehler

  /api/set/soc:
    put:
      tags: [Steuerung]
      summary: SOC manuell setzen
      description: |
        Setzt den SOC-Wert manuell (0.0 bis 100.0).
        **⚠️ Nur verwenden wenn der angezeigte SOC nicht korrekt ist!**
      operationId: setSoc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: number
                  format: double
                  minimum: 0.0
                  maximum: 100.0
                  description: SOC in Prozent
            example:
              value: 50.0
      responses:
        '200':
          description: Erfolgreich gesetzt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Ungültiger Wert
        '500':
          description: BMS-Kommunikationsfehler

  # ===================================================================
  # System
  # ===================================================================

  /api/health:
    get:
      tags: [System]
      summary: Health Check
      description: Prüft ob der Service und die BMS-Verbindung funktionieren
      operationId: getHealth
      responses:
        '200':
          description: Service ist gesund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                bms_connected: true
                poll_interval_seconds: 30
                last_update: "2024-12-15 14:30:00"
                last_error: null
        '503':
          description: Service nicht bereit

# ===================================================================
# Schemas
# ===================================================================

components:
  schemas:

    SOC:
      type: object
      properties:
        total_voltage:
          type: number
          format: double
          description: Gesamtspannung in Volt
          example: 52.5
        current:
          type: number
          format: double
          description: "Strom in Ampere (negativ = laden, positiv = entladen)"
          example: -2.5
        soc_percent:
          type: number
          format: double
          description: Ladezustand in Prozent
          example: 85.3
        last_update:
          type: string
          description: Zeitpunkt der letzten Aktualisierung
          example: "2024-12-15 14:30:00"

    CellVoltages:
      type: object
      description: "Spannung jeder Zelle in Volt. Key = Zellnummer (1-16)"
      additionalProperties:
        type: number
        format: double
      example:
        '1': 3.728
        '2': 3.734
        '3': 3.742
        last_update: "2024-12-15 14:30:00"

    CellVoltageRange:
      type: object
      properties:
        highest_voltage:
          type: number
          format: double
          description: Höchste Zellspannung in Volt
          example: 3.78
        highest_cell:
          type: integer
          description: Zellnummer mit höchster Spannung
          example: 14
        lowest_voltage:
          type: number
          format: double
          description: Niedrigste Zellspannung in Volt
          example: 3.728
        lowest_cell:
          type: integer
          description: Zellnummer mit niedrigster Spannung
          example: 1
        last_update:
          type: string

    Temperatures:
      type: object
      description: "Temperatur jedes Sensors in °C. Key = Sensornummer"
      additionalProperties:
        type: integer
      example:
        '1': 15
        last_update: "2024-12-15 14:30:00"

    TemperatureRange:
      type: object
      properties:
        highest_temperature:
          type: integer
          description: Höchste Temperatur in °C
          example: 15
        highest_sensor:
          type: integer
          description: Sensornummer
          example: 1
        lowest_temperature:
          type: integer
          description: Niedrigste Temperatur in °C
          example: 15
        lowest_sensor:
          type: integer
          example: 1
        last_update:
          type: string

    MosfetStatus:
      type: object
      properties:
        mode:
          type: string
          enum: [stationary, charging, discharging]
          description: Aktueller Betriebsmodus
          example: stationary
        charging_mosfet:
          type: boolean
          description: Lade-MOSFET aktiv
          example: true
        discharging_mosfet:
          type: boolean
          description: Entlade-MOSFET aktiv
          example: true
        capacity_ah:
          type: number
          format: double
          description: Restkapazität in Ah
          example: 5.67
        last_update:
          type: string

    Status:
      type: object
      properties:
        cells:
          type: integer
          description: Anzahl der Zellen
          example: 14
        temperature_sensors:
          type: integer
          description: Anzahl Temperatursensoren
          example: 1
        charger_running:
          type: boolean
          description: Ladegerät angeschlossen
          example: false
        load_running:
          type: boolean
          description: Last angeschlossen
          example: false
        states:
          type: object
          description: Digitale Ein-/Ausgänge
          properties:
            DI1:
              type: boolean
            DI2:
              type: boolean
            DI3:
              type: boolean
            DI4:
              type: boolean
            DO1:
              type: boolean
            DO2:
              type: boolean
            DO3:
              type: boolean
            DO4:
              type: boolean
        cycles:
          type: integer
          description: Anzahl Lade-/Entladezyklen
          example: 21
        last_update:
          type: string

    Errors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
          description: Liste aktiver Fehlermeldungen
          example:
            - "SOC is too low. level one alarm"
        has_errors:
          type: boolean
          description: true wenn Fehler vorhanden
          example: true
        last_update:
          type: string

    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
          example: ok
        bms_connected:
          type: boolean
          example: true
        poll_interval_seconds:
          type: integer
          example: 30
        last_update:
          type: string
          example: "2024-12-15 14:30:00"
        last_error:
          type: string
          nullable: true
          example: null

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Discharge MOSFET set to on"

    Error:
      type: object
      properties:
        error:
          type: string
          example: "BMS-Daten noch nicht verfügbar"
        status:
          type: integer
          example: 503

    AllData:
      type: object
      properties:
        soc:
          $ref: '#/components/schemas/SOC'
        cell_voltage_range:
          $ref: '#/components/schemas/CellVoltageRange'
        temperature_range:
          $ref: '#/components/schemas/TemperatureRange'
        mosfet_status:
          $ref: '#/components/schemas/MosfetStatus'
        status:
          $ref: '#/components/schemas/Status'
        cell_voltages:
          $ref: '#/components/schemas/CellVoltages'
        temperatures:
          $ref: '#/components/schemas/Temperatures'
        errors:
          type: array
          items:
            type: string
        last_update:
          type: string